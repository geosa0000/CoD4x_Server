name: build

on:
  push:
    branches: [master, develop]
    tags: ['*']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-dll:
    name: Build cod4x_021.dll (MinGW cross-compile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm g++-mingw-w64-i686-posix mingw-w64-i686-dev

      - name: CMake configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++

      - name: Build
        run: cmake --build build --parallel

      - name: Hash artifacts
        run: |
          cp build/bin/cod4x_*.dll .
          sha1sum cod4x_*.dll > hashes.txt
          cat hashes.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cod4x_021
          path: |
            build/bin/cod4x_*.dll
            hashes.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ github.ref_name }}
          artifacts: "build/bin/cod4x_*.dll,hashes.txt"
          token: ${{ secrets.GITHUB_TOKEN }}
